# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render prompts for every var marked `sync: false`; those are never stored
# in git.
services:
  - type: web
    name: kyc-document-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # --- secrets: entered in the Render dashboard, never committed --------
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false

      # --- tunables --------------------------------------------------------
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      # 150 DPI keeps page rasters inside the 512MB free-tier memory limit.
      - key: RENDER_DPI
        value: "150"
      - key: MAX_PAGES_PER_DOC
        value: "6"
      - key: COOKIE_SECURE
        value: "true"

      # --- persistence -----------------------------------------------------
      # The free plan has no disk, so DATA_DIR stays unset and the app writes
      # to ./data — wiped on every deploy, then re-seeded from kyc-test-docs.
      #
      # To keep uploads and verification runs across deploys: move to a paid
      # plan, uncomment the `disk:` block below, and add
      #   - key: DATA_DIR
      #     value: /var/data
      #
      # disk:
      #   name: kyc-data
      #   mountPath: /var/data
      #   sizeGB: 1
